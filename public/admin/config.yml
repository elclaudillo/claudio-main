          - { name: worksHeading, label: Works heading, widget: string }
          - { name: playVideo, label: Play video label, widget: string }
          - { name: seriesLinkLabel, label: Series link label, widget: string }
          - { name: otherWork, label: Other work heading, widget: string }
          - { name: aboutHeading, label: About heading, widget: string }
          - { name: aboutQuote, label: About quote, widget: string, required: false, hint: "Pull quote shown after the second paragraph." }
          - { name: aboutQuoteAuthor, label: Quote author, widget: string, required: false }
          - { name: about, label: About paragraphs, hint: "The first paragraph is shown larger as an introduction.", label_singular: Paragraph, widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
          - { name: selectedMedia, label: Selected media heading, widget: string }
          - { name: installNote, label: Install note, widget: string }
          - { name: showAll, label: "Button: Show all (other work)", widget: string, required: false }
