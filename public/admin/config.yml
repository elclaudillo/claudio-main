# Dashboard for the site's artwork and text: https://sveltiacms.app
# Opens at /admin/. Each save commits to the GitHub repo and Netlify rebuilds.
# Locally (npm run dev, then http://localhost:4321/admin/) choose
# "Work with Local Repository" and pick this project folder (Chrome or Edge).

backend:
  name: github
  repo: elclaudillo/claudio-main
  branch: main

media_folder: art
public_folder: /art
site_url: https://claudiocastillo.netlify.app
display_url: https://claudiocastillo.netlify.app

collections:
  - name: works
    label: Artworks
    label_singular: Artwork
    description: >-
      Each artwork is a card on the home page (Selected Works) and/or a Work menu page,
      depending on its section and category. Hidden works stay saved but are not shown.
    folder: src/content/works
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{title}}"
    summary: "{{title}} · {{year}} · {{section}}"
    sortable_fields: [title, year]
    view_filters:
      - { label: Selected Works, field: section, pattern: selected }
      - { label: Other work, field: section, pattern: other }
      - { label: Visible, field: visible, pattern: true }
      - { label: Hidden, field: visible, pattern: false }
      - { label: Featured in slideshow, field: featured, pattern: true }
    fields:
      - { name: title, label: Title, widget: string, hint: "Shown in lowercase on the site." }
      - { name: year, label: Year, widget: string, required: false }
      - name: section
        label: Section
        widget: select
        default: selected
        options:
          - { label: Selected Works, value: selected }
          - { label: Other work, value: other }
        hint: Selected Works also shows on the home page. Every work shows on its category's Work page either way.
      - name: category
        label: Category
        widget: select
        required: false
        options:
          - { label: Clocks, value: clock }
          - { label: Generative, value: generative }
          - { label: Portraits, value: portrait }
          - { label: Prints, value: print }
          - { label: RSS Live feeds, value: rss }
          - { label: Watercolors, value: watercolour }
        hint: >-
          Which Work menu page shows it. All generative shows Clocks, Generative and RSS together;
          Portraits, Prints and Watercolors stay on their own pages. Empty means Generative.
      - { name: visible, label: Visible on site, widget: boolean, default: true }
      - name: featured
        label: Featured in slideshow
        widget: boolean
        default: false
        hint: The slideshow at the top of the home page plays featured works. Work pages play all their pieces.
      - name: heroOrder
        label: Slideshow position
        widget: number
        value_type: int
        min: 1
        required: false
        hint: Order in the home slideshow and Selected Works. Lower numbers come first; empty goes last.
      - name: clockOrder
        label: Position on Clocks page
        widget: number
        value_type: int
        min: 1
        required: false
        hint: Order on the Clocks page. Lower numbers come first; empty goes last, by title.
      - name: images
        label: Images
        label_singular: Image
        widget: list
        min: 1
        hint: >-
          The card shows one of these at random and keeps rotating through them.
          Upload JPG or PNG files (under 10 MB). The site makes the web sizes itself.
        field: { name: image, label: Image, widget: image }
      - { name: video, label: Sample video link, widget: string, required: false, hint: "YouTube link. Plays muted in the slideshow and opens from Play sample video; add &t=90s to start partway through. Leave empty for works without a video." }
      - { name: seriesLink, label: Series link, widget: string, required: false, hint: "Optional. A series page on this site (/series/<name>/, see Series) or any web address. Shown in the detail window as \"See additional pieces in same series\"." }
      - { name: medium, label: Card text, widget: text, hint: "Short description shown on the card." }
      - { name: modalMedium, label: Detail text, widget: text, required: false, hint: "Longer description for the detail window. Leave empty to reuse the card text." }
      - { name: modalExtra, label: Edition and exhibitions, widget: text, required: false, hint: "e.g. Edition of 8 with 2 APs, videos and prints." }
      - name: translations
        label: Translations
        widget: object
        collapsed: true
        required: false
        hint: Leave any field empty to show the English text in that language.
        fields:
          - name: es
            label: "Español"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: medium, label: Card text, widget: text, required: false }
              - { name: modalMedium, label: Detail text, widget: text, required: false }
              - { name: modalExtra, label: Edition and exhibitions, widget: text, required: false }
          - name: it
            label: "Italiano"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: medium, label: Card text, widget: text, required: false }
              - { name: modalMedium, label: Detail text, widget: text, required: false }
              - { name: modalExtra, label: Edition and exhibitions, widget: text, required: false }
          - name: fr
            label: "Français"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: medium, label: Card text, widget: text, required: false }
              - { name: modalMedium, label: Detail text, widget: text, required: false }
              - { name: modalExtra, label: Edition and exhibitions, widget: text, required: false }
          - name: de
            label: "Deutsch"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: medium, label: Card text, widget: text, required: false }
              - { name: modalMedium, label: Detail text, widget: text, required: false }
              - { name: modalExtra, label: Edition and exhibitions, widget: text, required: false }
          - name: ko
            label: "한국어"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: medium, label: Card text, widget: text, required: false }
              - { name: modalMedium, label: Detail text, widget: text, required: false }
              - { name: modalExtra, label: Edition and exhibitions, widget: text, required: false }
          - name: ja
            label: "日本語"
