  - name: media
    label: Selected Media
    label_singular: Link group
    description: >-
      Press links in the About section, grouped (Press releases, Interviews, ...).
      Upload PDFs with the link field's file picker or paste a YouTube link.
    folder: src/content/media
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{title}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    media_folder: /public/press
    public_folder: /press
    fields:
      - { name: title, label: Group title, widget: string }
      - { name: order, label: Position, widget: number, value_type: int, default: 10, hint: "Lower numbers come first." }
      - name: layout
        label: Layout
        widget: select
        default: list
        options:
          - { label: "List (source + title)", value: list }
          - { label: "Row of links (like Sotheby's / Miami Herald)", value: row }
      - name: items
        label: Links
        label_singular: Link
        widget: list
        fields:
          - { name: label, label: Title, widget: string }
          - { name: source, label: Source, widget: string, required: false, hint: "Outlet or author, e.g. El Nuevo Herald." }
          - { name: url, label: Link or PDF, widget: file, hint: "Upload a PDF, or paste a URL (YouTube, article, ...)." }

  - name: mediaDocs
    label: Media documents
    label_singular: Document
    description: Longer texts shown as expandable panels under Selected Media (Exhibitions, CV / Bio, Art statement).
    folder: src/content/media-docs
    format: frontmatter
    extension: md
    create: true
    delete: true
    identifier_field: title
    slug: "{{title}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: order, label: Position, widget: number, value_type: int, default: 10 }
      - { name: body, label: Text, widget: markdown }

