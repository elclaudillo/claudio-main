  - name: press
    label: Press
    description: The Press page (/press/). One list; the site sorts it by date, newest first.
    media_folder: /public/press
    public_folder: /press
    files:
      - name: press
        label: Press list
        file: src/content/press/press.json
        fields:
          - name: items
            label: Press items
            label_singular: Press item
            widget: list
            summary: "{{fields.date}} {{fields.source}}: {{fields.label}}"
            fields:
              - { name: date, label: Date, widget: string, required: false, pattern: ['^(\d{4}(-\d{2}(-\d{2})?)?)?$', 'Use YYYY-MM-DD, YYYY-MM or YYYY'], hint: "2023-12-07, 2023-12 or 2023. Items with no date go at the end." }
              - { name: source, label: Source, widget: string, required: false, hint: "Outlet or author, e.g. El Nuevo Herald." }
              - { name: label, label: Title, widget: string }
              - { name: url, label: Link or PDF, widget: file, required: false, hint: "Upload a PDF, or paste a URL (YouTube, article, ...). Leave empty to show just the picture and caption." }
              - { name: image, label: Picture, widget: image, required: false, hint: "A photo, or a picture of the article's first page." }
              - { name: logo, label: Publication logo, widget: image, required: false }
              - { name: extraUrl, label: Second link, widget: file, required: false, hint: "Optional, e.g. the English version or a video." }
              - { name: extraLabel, label: Second link text, widget: string, required: false, hint: "e.g. English, Video." }

  - name: mediaDocs
    label: Media documents
    label_singular: Document
    description: Longer texts shown as boxes in About, after Art statement and the Press link (Exhibitions, CV / Bio).
    folder: src/content/media-docs
    format: frontmatter
    extension: md
    create: true
    delete: true
    identifier_field: title
    slug: "{{title}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: order, label: Position, widget: number, value_type: int, default: 10 }
      - { name: body, label: Text, widget: markdown }

  - name: series
    label: Series
    label_singular: Series
    description: >-
      Pages at /series/<name>/ showing the other pieces in a series. An artwork links to one
      by putting /series/<name>/ in its "Series link" field.
    folder: src/content/series
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{title}}"
    summary: "{{title}} · /series/{{slug}}/"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: order, label: Position, widget: number, value_type: int, default: 10 }
      - { name: intro, label: Introduction, widget: text, required: false }
      - name: pieces
        label: Pieces
        label_singular: Piece
        widget: list
        summary: "{{fields.title}} {{fields.year}}"
        fields:
          - { name: title, label: Title, widget: string, hint: "Shown in lowercase on the site." }
          - { name: year, label: Year, widget: string, required: false }
          - { name: image, label: Image, widget: image }
          - { name: video, label: Sample video (YouTube link), widget: string, required: false }
          - { name: text, label: Description, widget: text, required: false }
      - name: links
        label: Extra links
        label_singular: Link
        widget: list
        required: false
        hint: Shown under the pieces, e.g. installation videos or press articles.
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string }

  - name: live
    label: Live stream
    description: The YouTube stream behind the Live button and /live/. Changes go live after the site rebuilds (a minute or two).
    files:
      - name: live
        label: Live stream
        file: src/data/live.json
        fields:
          - name: channel
            label: YouTube channel ID
            widget: string
            pattern: ['^UC[\w-]{22}$', 'A channel ID starts with UC and is 24 characters long']
            hint: "The /live/ page follows whatever this channel is broadcasting. Find it in YouTube Studio → Settings → Channel → Advanced settings."
          - name: video
            label: Pinned broadcast link
            widget: string
            required: false
            hint: "Optional. Paste a YouTube link (watch, youtu.be or /live/ URL) to always show that broadcast. Leave empty to follow the channel automatically."

